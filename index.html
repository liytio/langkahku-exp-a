<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LangkahKu – Pendamping Langkah Harian</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <header class="bg-emerald-600 text-white">
    <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold">LangkahKu</h1>
        <p class="text-emerald-100 text-sm" id="todayLabel"></p>
      </div>
      <button id="syncBtn" class="bg-white text-emerald-700 font-semibold text-sm px-4 py-2 rounded-lg hover:bg-emerald-50">
        Sinkronkan
      </button>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-6 space-y-5">
    <!-- F1 Dashboard hari ini -->
    <section class="bg-white rounded-2xl shadow p-5">
      <h2 class="text-sm font-semibold text-slate-500 uppercase">Hari ini</h2>
      <div class="mt-2 flex items-end gap-2">
        <span id="totalSteps" class="text-5xl font-extrabold">0</span>
        <span class="text-slate-500 mb-2">langkah</span>
      </div>
      <div class="mt-4 h-3 bg-slate-200 rounded-full overflow-hidden">
        <div id="progressBar" class="h-full bg-emerald-500 rounded-full transition-all" style="width:0%"></div>
      </div>
      <p class="mt-2 text-sm text-slate-600"><span id="progressPct">0</span>% dari target <span id="targetLabel">0</span> langkah</p>
      <div class="mt-4 grid grid-cols-2 gap-3">
        <div class="bg-slate-50 rounded-xl p-3">
          <p class="text-xs text-slate-500">Jarak</p>
          <p class="text-lg font-bold"><span id="distance">0</span> km</p>
        </div>
        <div class="bg-slate-50 rounded-xl p-3">
          <p class="text-xs text-slate-500">Kalori</p>
          <p class="text-lg font-bold"><span id="calories">0</span> kkal</p>
        </div>
      </div>
    </section>

    <div class="grid md:grid-cols-2 gap-5">
      <!-- F2 Sumber data langkah -->
      <section class="bg-white rounded-2xl shadow p-5">
        <h2 class="font-semibold">Sumber Data Langkah</h2>
        <ul class="mt-3 space-y-2">
          <li class="flex justify-between bg-slate-50 rounded-lg px-3 py-2">
            <span>📱 HP</span><span id="phoneSteps" class="font-semibold">0</span>
          </li>
          <li class="flex justify-between bg-slate-50 rounded-lg px-3 py-2">
            <span>⌚ Smartwatch</span><span id="watchSteps" class="font-semibold">0</span>
          </li>
        </ul>
      </section>

      <!-- F3 Tampilan jam -->
      <section class="bg-white rounded-2xl shadow p-5 flex flex-col items-center">
        <h2 class="font-semibold self-start">Tampilan Jam</h2>
        <div class="mt-3 w-40 h-40 rounded-full bg-slate-900 border-8 border-slate-700 flex flex-col items-center justify-center text-white">
          <span class="text-xs text-slate-400">Langkah</span>
          <span id="watchFace" class="text-3xl font-bold text-sky-400">0</span>
        </div>
      </section>
    </div>

    <!-- F4 Riwayat 7 hari -->
    <section class="bg-white rounded-2xl shadow p-5">
      <h2 class="font-semibold">Riwayat 7 Hari</h2>
      <div id="historyChart" class="mt-4 flex items-end justify-between gap-2 h-40"></div>
    </section>

    <div class="grid md:grid-cols-2 gap-5">
      <!-- F6 Target langkah -->
      <section class="bg-white rounded-2xl shadow p-5">
        <h2 class="font-semibold">Target Langkah</h2>
        <form id="targetForm" class="mt-3 flex gap-2">
          <input id="targetInput" type="number" min="500" step="500" class="flex-1 border border-slate-300 rounded-lg px-3 py-2" />
          <button class="bg-emerald-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-emerald-700">Simpan</button>
        </form>
      </section>

      <!-- F7 Bagikan -->
      <section class="bg-white rounded-2xl shadow p-5">
        <h2 class="font-semibold">Bagikan</h2>
        <p class="text-sm text-slate-500 mt-1">Bagikan ringkasan langkah hari ini.</p>
        <button id="shareBtn" class="mt-3 w-full bg-sky-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-sky-700">Bagikan Ringkasan</button>
      </section>
    </div>
  </main>

  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-sm px-4 py-2 rounded-lg opacity-0 transition-opacity pointer-events-none"></div>

  <script src="app.js"></script>
</body>
</html>
